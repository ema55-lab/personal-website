<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Ema Prović</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="container">
      <a href="index.html" class="nav-logo">Ema Prović</a>
      <div class="nav-links">
        <a href="projects.html">Projects</a>
        <a href="gallery.html">Gallery</a>
        <a href="https://emaprovic.substack.com/" target="_blank" rel="noopener">Substack</a>
      </div>
    </div>
  </nav>

  <main>

    <!-- Page Header -->
    <section class="page-header">
      <div class="container">
        <h1>Gallery</h1>
      </div>
    </section>

    <!--
      =============================================
      PHOTO GALLERY
      =============================================
      To replace a placeholder with a real photo, swap the <div> for an <img>:

        BEFORE:
        <div class="placeholder-photo portrait">
          <span>Photo 1</span>
        </div>

        AFTER:
        <img src="photos/your-photo.jpg" alt="Description of the photo">

      To add more photos, copy any <div class="placeholder-photo ..."> block
      and paste it inside the gallery-grid container.

      Aspect ratio classes: portrait, landscape, square, wide
    -->

    <!-- Gallery Grid -->
    <section class="gallery-section">
      <div class="gallery-grid">

        <img src="images/Photo09_9.jpg" alt="Landscape photograph by Ema Prović">

        <img src="images/Photo12_12.jpg" alt="Portrait photograph by Ema Prović">

        <img src="images/Photo13_13.jpg" alt="Portrait photograph by Ema Prović">

        <img src="images/Photo14_14.jpg" alt="Portrait photograph by Ema Prović">

        <img src="images/Photo15_15.jpg" alt="Landscape photograph by Ema Prović">

        <img src="images/Photo16_16.jpg" alt="Landscape photograph by Ema Prović">

        <img src="images/Photo19_19.jpg" alt="Landscape photograph by Ema Prović">

        <img src="images/Photo23_23.jpg" alt="Landscape photograph by Ema Prović">

        <img src="images/Photo26_26.jpg" alt="Portrait photograph by Ema Prović">

        <img src="images/Photo27_27.jpg" alt="Landscape photograph by Ema Prović">

        <img src="images/Photo28_28.jpg" alt="Landscape photograph by Ema Prović">

        <img src="images/Photo29_29.jpg" alt="Landscape photograph by Ema Prović">

        <img src="images/Photo33_33.jpg" alt="Landscape photograph by Ema Prović">

        <img src="images/Photo34_34.jpg" alt="Landscape photograph by Ema Prović">

        <img src="images/Photo36_36A.jpg" alt="Portrait photograph by Ema Prović">

      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-col">
        <h4>Ema Prović</h4>
        <p>Film Photography</p>
      </div>
      <div class="footer-col">
        <h4>Location</h4>
        <p>Brussels / London</p>
      </div>
      <div class="footer-col">
        <h4>Contact</h4>
        <a href="mailto:emaprvc@gmail.com">emaprvc@gmail.com</a>
      </div>
    </div>
  </footer>

  <!-- Lightbox overlay -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo enlarged view">
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    document.querySelectorAll('.gallery-grid img').forEach(function(img) {
      img.addEventListener('click', function() {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('open');
      });
    });

    lightbox.addEventListener('click', function() {
      lightbox.classList.remove('open');
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') lightbox.classList.remove('open');
    });
  </script>

</body>
</html>
